name: AWS Types

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '27 4 * * 1'

jobs:

  types:
    name: Type coverage
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ipxe/ipxe-builder-cloud
    env:
      types: ${{ join ( fromJson ( vars.AWS_TEST ).*.type, ' ' ) }}
    environment: aws-import
    permissions:
      id-token: write
      contents: read
    steps:

      - name: Check out code
        uses: actions/checkout@v6

      - name: Log in
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Check type coverage
        working-directory: src
        run: |
          ../contrib/cloud/aws-types ${{ env.types }}
